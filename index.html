<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05061a" />
    <meta name="description" content="Bend gravity and slingshot a probe through planets and black holes to reach the beacon." />
    <title>Orbit Slingshot</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <section id="title" class="screen center">
      <div class="title-card">
        <p class="eyebrow">A gravity puzzle</p>
        <h1>Orbit<br /><span>Slingshot</span></h1>
        <p class="tagline">Bend gravity. Deliver the probe.</p>
        <div class="actions">
          <button id="btn-play" class="btn primary">Play</button>
          <button id="btn-levels" class="btn ghost">Levels</button>
        </div>
        <p class="keys">Drag to aim &middot; release to launch &middot; <kbd>R</kbd> restart &middot; <kbd>Space</kbd> recall</p>
      </div>
    </section>

    <section id="levels" class="screen center">
      <div class="panel">
        <div class="panel-head">
          <button id="btn-levels-back" class="icon-btn" aria-label="Back">
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
          </button>
          <h2>Select level</h2>
        </div>
        <div id="level-grid"></div>
      </div>
    </section>

    <section id="hud" class="screen">
      <div class="hud-bar">
        <div id="level-label" class="level-label"></div>
        <div class="shots">Shots <span id="shots">0</span></div>
        <div class="hud-actions">
          <button id="btn-restart" class="icon-btn" aria-label="Restart level">
            <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7" /><path d="M4 4v4.5h4.5" /></svg>
          </button>
          <button id="btn-mute" class="icon-btn" aria-label="Mute">
            <svg class="on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" /><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /></svg>
            <svg class="off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" /><path d="M17 9l5 6M22 9l-5 6" /></svg>
          </button>
          <button id="btn-menu" class="icon-btn" aria-label="Levels">
            <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.5" /><rect x="14" y="4" width="6" height="6" rx="1.5" /><rect x="4" y="14" width="6" height="6" rx="1.5" /><rect x="14" y="14" width="6" height="6" rx="1.5" /></svg>
          </button>
        </div>
      </div>
      <p id="hint" class="hint"></p>
    </section>

    <section id="win" class="screen center">
      <div class="panel win-panel">
        <p class="eyebrow">Transmission received</p>
        <h2 id="win-title">Probe delivered</h2>
        <div id="win-stars" class="win-stars"></div>
        <p id="win-shots" class="win-shots"></p>
        <div class="actions">
          <button id="btn-next" class="btn primary">Next level</button>
          <button id="btn-retry" class="btn ghost">Retry</button>
          <button id="btn-win-levels" class="btn ghost">Levels</button>
        </div>
      </div>
    </section>

    <div id="toast" class="toast" role="status"></div>
    <p class="rotate-hint">Rotate your phone for a bigger view</p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
